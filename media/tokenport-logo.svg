<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="portGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tokenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Port container shape - represents the harbor/port -->
  <rect x="120" y="220" width="272" height="160" rx="16" fill="url(#portGradient)" opacity="0.9"/>
  
  <!-- Water waves -->
  <path d="M120 340 Q 184 320, 256 340 T 392 340" stroke="#60a5fa" stroke-width="8" fill="none" opacity="0.8"/>
  <path d="M120 360 Q 184 340, 256 360 T 392 360" stroke="#93c5fd" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- Token T shape - stylized -->
  <g transform="translate(200, 160)">
    <rect x="0" y="0" width="112" height="32" rx="6" fill="url(#tokenGradient)" filter="url(#shadow)"/>
    <rect x="40" y="32" width="32" height="120" rx="6" fill="url(#tokenGradient)" filter="url(#shadow)"/>
  </g>

  <!-- Connection lines - representing transit and relay -->
  <line x1="160" y1="280" x2="220" y2="280" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="280" x2="220" y2="280" stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="220;320;220" dur="2s" repeatCount="indefinite"/>
  </line>
  <circle cx="320" cy="280" r="6" fill="#fbbf24"/>
  
  <line x1="160" y1="310" x2="220" y2="310" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <line x1="220" y1="310" x2="220" y2="310" stroke="#fbbf24" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" values="220;320;220" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </line>
  <circle cx="320" cy="310" r="6" fill="#fbbf24"/>

  <!-- Globe dots - representing global connection -->
  <circle cx="150" cy="180" r="4" fill="#bfdbfe" opacity="0.8"/>
  <circle cx="380" cy="160" r="6" fill="#bfdbfe" opacity="0.9"/>
  <circle cx="400" cy="220" r="3" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="100" cy="240" r="3" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="390" cy="300" r="4" fill="#bfdbfe" opacity="0.7"/>

  <!-- Brand Name Text -->
  <text x="256" y="450" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="white">TokenPort</text>
</svg>