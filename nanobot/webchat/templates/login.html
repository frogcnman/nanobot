<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - nanobot Web Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .login-title {
            color: #333;
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .login-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .login-form {
            text-align: left;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #4a90d9;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-btn:hover {
            background: #3a7bc8;
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .info-box {
            background: #f0f7ff;
            border: 1px solid #d0e8ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        
        .info-box h4 {
            margin: 0 0 10px 0;
            color: #2c5282;
            font-size: 14px;
        }
        
        .info-box p {
            margin: 0;
            color: #4a5568;
            font-size: 13px;
            line-height: 1.5;
        }
        
        .info-box code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        .register-link {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .register-link a {
            color: #4a90d9;
            text-decoration: none;
            font-size: 14px;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">🐈</div>
        <h1 class="login-title">nanobot Web Chat</h1>
        <p class="login-subtitle">请登录以继续</p>
        
        <div id="setupInfo" class="info-box" style="display: none;">
            <h4>👋 首次使用？</h4>
            <p>请创建一个管理员账号来开始使用</p>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">登录</button>
            
            <div class="error-message" id="errorMessage"></div>
        </form>
        
        <div class="register-link" id="registerLink" style="display: none;">
            <p>还没有账号？<a href="#" id="showRegister">创建账号</a></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div class="modal" id="registerModal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3>创建账号</h3>
                <button class="modal-close" id="closeRegister">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="newUsername">用户名</label>
                    <input type="text" id="newUsername" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="newPassword">密码</label>
                    <input type="password" id="newPassword" placeholder="至少4个字符">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入密码">
                </div>
                <div class="error-message" id="registerError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelRegister">取消</button>
                <button class="btn btn-primary" id="confirmRegister">创建</button>
            </div>
        </div>
    </div>

    <script>
        // Check auth status
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status');
                const data = await response.json();
                
                if (data.authenticated) {
                    // Already logged in, redirect to chat
                    window.location.href = '/';
                    return;
                }
                
                if (!data.auth_enabled) {
                    // Auth not enabled, redirect to chat
                    window.location.href = '/';
                    return;
                }
                
                if (data.users && data.users.length === 0) {
                    // First time setup
                    document.getElementById('setupInfo').style.display = 'block';
                    document.getElementById('registerLink').style.display = 'block';
                } else {
                    // Show login form
                    document.getElementById('registerLink').style.display = 'block';
                }
            } catch (e) {
                console.error('Auth check failed:', e);
            }
        }
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            errorMsg.classList.remove('show');
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Login successful
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.error || '登录失败';
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });
        
        // Show register modal
        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('registerModal').style.display = 'flex';
        });
        
        // Close register modal
        document.getElementById('closeRegister').addEventListener('click', () => {
            document.getElementById('registerModal').style.display = 'none';
        });
        
        document.getElementById('cancelRegister').addEventListener('click', () => {
            document.getElementById('registerModal').style.display = 'none';
        });
        
        // Register new user
        document.getElementById('confirmRegister').addEventListener('click', async () => {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorMsg = document.getElementById('registerError');
            
            if (!username || !password) {
                errorMsg.textContent = '用户名和密码不能为空';
                errorMsg.classList.add('show');
                return;
            }
            
            if (password.length < 4) {
                errorMsg.textContent = '密码长度至少4个字符';
                errorMsg.classList.add('show');
                return;
            }
            
            if (password !== confirmPassword) {
                errorMsg.textContent = '两次输入的密码不一致';
                errorMsg.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    alert('账号创建成功！请登录');
                    document.getElementById('registerModal').style.display = 'none';
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = '';
                    document.getElementById('setupInfo').style.display = 'none';
                    document.getElementById('registerLink').style.display = 'none';
                } else {
                    errorMsg.textContent = data.error || '创建失败';
                    errorMsg.classList.add('show');
                }
            } catch (e) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
            }
        });
        
        // Initialize
        checkAuth();
    </script>
</body>
</html>
